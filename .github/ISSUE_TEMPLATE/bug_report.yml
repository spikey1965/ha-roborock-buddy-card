name: Bug report
description: Something on the card is wrong or missing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. The more of this form you fill in, the quicker it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did the card show instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your robot and dock (model)
      placeholder: e.g. Roborock Qrevo S with its wash dock, or Q7 M5+
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Card version and Home Assistant version
      placeholder: e.g. card 0.1.0, Home Assistant 2026.10.1
  - type: textarea
    id: config
    attributes:
      label: Your card YAML
      render: yaml
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of the card
      description: Drag an image in here.
  - type: textarea
    id: states
    attributes:
      label: Entity list
      description: Settings → Devices & services → Roborock → your robot (and its dock), and paste the list (or a screenshot) of the entities.
